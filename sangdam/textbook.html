<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>한우리 교사 상담도우미 | 교재 미리보기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#f7f2ec;--card:#fff;--ink:#2a1d14;--muted:#6f5d50;--line:#e9dccf;--orange:#f26a1b;--orange-deep:#c94f0a;--orange-soft:#ffe7d6;--leaf:#3f7d5a;--display:"Nanum Myeongjo",serif;--body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17110d;--card:#231913;--ink:#f6ebe2;--muted:#c2ad9d;--line:#3d2e24;--orange:#ff8a45;--orange-deep:#ffa36b;--orange-soft:#3a2416;--leaf:#7cc29a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17110d;--card:#231913;--ink:#f6ebe2;--muted:#c2ad9d;--line:#3d2e24;--orange:#ff8a45;--orange-deep:#ffa36b;--orange-soft:#3a2416;--leaf:#7cc29a;color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;word-break:keep-all}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--card);border-bottom:1px solid var(--line)}header .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
.logo-chip{display:inline-flex;background:#fff;border-radius:8px;padding:3px 8px}.logo{height:30px;display:block}
.ttl{font-weight:700;padding-left:10px;border-left:2px solid var(--orange)}
.home{margin-left:auto;font-size:13px;color:var(--muted)}
main{padding-block:28px 60px}h1{font-family:var(--display);font-size:30px;margin:0}
.lead{color:var(--muted);margin:6px 0 22px}
.tiles{display:grid;gap:14px}
.tile{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--orange);transform:translateY(-2px)}
.tile b{display:block;font-family:var(--display);font-size:24px}
.tile span{color:var(--muted)}
.tile em{font-style:normal;float:right;color:var(--orange);font-size:24px}
.note{font-size:13px;color:var(--muted);margin-top:22px}


.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.tabs button{font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;min-height:44px}
.tabs button.on{background:var(--orange);border-color:var(--orange);color:#fff}
.tabs .grow{border-color:var(--leaf);color:var(--leaf)}.tabs .grow.on{background:var(--leaf);color:#fff}
.exhead{background:var(--orange-soft);border-radius:16px;padding:14px 18px;margin:0 0 16px}.exhead b{font-size:17px}.exhead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.grid.ex .card img{aspect-ratio:4/5}
.tabs .ex{border-color:var(--orange-deep);color:var(--orange-deep)}.tabs .ex.on{background:var(--orange-deep);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--orange);transform:translateY(-2px)}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;display:block;background:#eee}
.card .c{padding:12px 14px 16px}
.card .a{display:inline-block;font-size:12px;font-weight:700;color:var(--orange-deep);background:var(--orange-soft);border-radius:6px;padding:2px 8px}
.card b{display:block;margin:6px 0 4px;font-size:16px}
.card p{margin:0;font-size:14px;color:var(--muted)}
.growth{display:grid;gap:14px;max-width:760px}
.gstep{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.gstep:hover{border-color:var(--leaf)}
.gstep img{width:120px;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:10px;display:block}
.gstep .gg{font-family:var(--display);font-size:24px;color:var(--leaf)}
.gstep b{display:block;font-size:17px;margin:2px 0}
.gstep span{color:var(--muted);font-size:14px}
.arrow{text-align:center;color:var(--leaf);font-size:20px;line-height:1;margin:-6px 0}
#lb{position:fixed;inset:0;z-index:90;background:#120c08;display:none;flex-direction:column}
#lb.open{display:flex}
#lb .bar{display:flex;align-items:center;gap:10px;padding:10px 16px;color:#fff}
#lb .bar .info{flex:1;min-width:0}
#lb .bar small{color:#ffb98a;font-weight:700}
#lb .bar b{display:block;font-size:15px}
#lb button{font:inherit;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:12px;min-width:48px;min-height:48px;font-size:22px;cursor:pointer}
#lb .view{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;touch-action:pan-x pan-y pinch-zoom}
#lb .view img{max-width:100%;height:auto;display:block;margin:0 auto;transition:width .15s}
#lb.zoom .view img{max-width:none;width:170%}
#lb .pt{color:#f4e6da;padding:10px 16px 14px;font-size:15px;text-align:center}
@media (max-width:520px){.gstep{grid-template-columns:90px 1fr}.gstep img{width:90px}}

.intro{background:var(--orange-soft);border-radius:16px;padding:14px 18px;margin:0 0 16px}.intro b{font-size:18px}.intro .gr{display:inline-block;margin-left:8px;font-size:13px;font-weight:700;color:var(--orange-deep)}.intro p{margin:4px 0 0;color:var(--muted);font-size:14px}
.grid.bk .card img{aspect-ratio:4/3;object-position:center}
.sess{font-size:17px;margin:26px 0 10px;padding:6px 14px;border-left:5px solid var(--orange);background:var(--orange-soft,#ffe7d6);border-radius:8px}
</style></head><body>
