<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>한우리 교사 상담도우미 | 상담 진단 채점판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 선생님용 도구 — 잠금 → 학년·이름 → 답안 체크(OMR) → (학생 모드면 다시 잠금) → 결과·추천 */
:root{
  --bg:#f7f2ec;--card:#ffffff;--ink:#2a1d14;--muted:#6f5d50;--line:#e9dccf;
  --orange:#f26a1b;--orange-deep:#c94f0a;--orange-soft:#ffe7d6;--leaf:#3f7d5a;--leaf-soft:#e3f1e8;
  --good:#3f7d5a;--mid:#c98a0a;--low:#c9431b;--good-soft:#e3f1e8;--mid-soft:#fbf0d6;--low-soft:#fbe3da;
  --display:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17110d;--card:#231913;--ink:#f6ebe2;--muted:#c2ad9d;--line:#3d2e24;--orange:#ff8a45;--orange-deep:#ffa36b;--orange-soft:#3a2416;--leaf:#7cc29a;--leaf-soft:#1f3328;
  --good:#7cc29a;--mid:#e8b44a;--low:#ff8a6b;--good-soft:#1f3328;--mid-soft:#3a2e14;--low-soft:#3d1f17;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17110d;--card:#231913;--ink:#f6ebe2;--muted:#c2ad9d;--line:#3d2e24;--orange:#ff8a45;--orange-deep:#ffa36b;--orange-soft:#3a2416;--leaf:#7cc29a;--leaf-soft:#1f3328;
  --good:#7cc29a;--mid:#e8b44a;--low:#ff8a6b;--good-soft:#1f3328;--mid-soft:#3a2e14;--low-soft:#3d1f17;color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;word-break:keep-all}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{border-bottom:1px solid var(--line);background:var(--card)}
header .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.logo-chip{display:inline-flex;background:#fff;border-radius:8px;padding:3px 8px}
.logo{height:30px;display:block}
.ttl{font-weight:700;font-size:15px;padding-left:10px;border-left:2px solid var(--orange);white-space:nowrap}
.hbtn{margin-left:auto;background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
main{padding-block:22px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 22px}
h1,h2{font-family:var(--display);font-weight:800;line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:clamp(24px,5vw,32px)}
h2{font-size:22px}
.t1{font-size:clamp(24px,5vw,32px)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--orange);background:var(--orange);color:#fff;font-weight:700;border-radius:14px;padding:13px 20px;cursor:pointer;font-size:16px;text-decoration:none}
.btn:hover{background:var(--orange-deep);border-color:var(--orange-deep)}
.btn.line{background:transparent;color:var(--orange-deep)}
.btn.line:hover{background:var(--orange-soft)}
.btn[disabled]{opacity:.45;cursor:default}
.lock{max-width:380px;margin:40px auto 0;text-align:center}
.pin{display:flex;gap:10px;justify-content:center;margin:22px 0 10px}
.pin input{width:56px;height:64px;text-align:center;font-size:28px;font-weight:700;border:2px solid var(--line);border-radius:14px;background:var(--card)}
.pin input:focus{border-color:var(--orange);outline:none}
.err{color:var(--low);font-size:14px;min-height:1.6em;margin:0}
.grid-g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.grid-g button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 4px;font-weight:700;cursor:pointer}
.grid-g button.on{border-color:var(--orange);background:var(--orange);color:#fff}
.field{display:grid;gap:6px;margin-top:20px;font-weight:700;font-size:15px}
.field input{border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--card);font-weight:400}
.wide-btn{width:100%;margin-top:24px;font-size:18px;padding:16px}
.passage{margin-top:16px;border:2px solid var(--line);border-radius:14px;padding:10px;background:#fff}
.ptag{font-size:12px;font-weight:700;color:var(--orange-deep);margin:0 0 6px 4px}
.passage img,.qimg{width:100%;height:auto;display:block;border-radius:8px}
.qimg{margin-top:14px;border:1px solid var(--line);background:#fff;padding:6px}
.multi{margin:12px 0 0;font-weight:700;color:var(--orange-deep)}
.bigopts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}
.bigopts.four{grid-template-columns:repeat(4,1fr)}
.bigopts button{height:64px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:28px;cursor:pointer}
.bigopts button.on{background:var(--orange);border-color:var(--orange);color:#fff}
.modes{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
@media (max-width:520px){.grid-g{grid-template-columns:repeat(3,1fr)}.modes{grid-template-columns:1fr}}
.mode-note{font-size:13px;color:var(--muted);margin-top:10px}

.sheet-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.count{font-variant-numeric:tabular-nums;font-weight:700;color:var(--orange-deep)}
.bar{height:6px;border-radius:999px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange);width:0;transition:width .2s}
.rows{display:grid;gap:6px;margin-top:16px}
.row{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--bg)}
.row.done{background:var(--orange-soft)}
.row .n{font-weight:800;font-family:var(--display);font-size:18px;text-align:center;font-variant-numeric:tabular-nums}
.row .n small{display:block;font-family:var(--body);font-size:10px;font-weight:700;color:var(--orange-deep);line-height:1.1}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;display:grid;place-items:center}
.opts button.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.sheet-foot{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}

.handoff{text-align:center;padding-block:30px}
.handoff .big{font-size:56px;line-height:1}

.res-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.score{font-family:var(--display);font-weight:800;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:20px;color:var(--muted)}
.lv{display:inline-block;font-weight:800;padding:4px 14px;border-radius:999px;font-size:15px}
.lv.g{background:var(--good-soft);color:var(--good)}.lv.m{background:var(--mid-soft);color:var(--mid)}.lv.l{background:var(--low-soft);color:var(--low)}
.lvtext{margin:12px 0 0;padding:14px 16px;border-radius:14px;background:var(--bg)}
.lvtext p{margin:0}
.areas{display:grid;gap:12px;margin-top:22px}
.area-top{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-variant-numeric:tabular-nums}
.area-bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
.area-bar i{display:block;height:100%;border-radius:999px}
.area p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.tag{font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;margin-left:6px}
.sec{margin-top:26px}
.sec h3{margin:0 0 10px;font-size:16px}
.wrong{display:flex;flex-wrap:wrap;gap:6px}
.wrong span{font-size:13px;padding:4px 10px;border-radius:10px;background:var(--low-soft);color:var(--low);font-weight:700}
.rec{border:2px solid var(--orange);border-radius:18px;padding:18px;background:var(--card)}
.rec .label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--orange-deep)}
.rec h4{margin:4px 0 0;font-family:var(--display);font-size:22px}
.rec p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.combo{display:grid;gap:8px;margin-top:12px}
.combo a{display:flex;justify-content:space-between;gap:10px;align-items:center;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--bg)}
.combo a:hover{border-color:var(--orange)}
.combo a b{font-size:16px}
.combo a small{color:var(--muted);font-size:13px}
.combo a span{color:var(--orange)}
.plus{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--orange-soft);font-size:14px}
.res-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.cap{background:var(--card)}
</style>
</head>

<main class="wrap">
  <!-- 잠금 -->
  <section class="card lock" id="v-lock">
    <h2 class="t1">선생님 전용</h2>
    <p class="muted" id="lockMsg">지부 코드 4자리를 입력해 주세요.</p>
    <div class="pin" id="pin">
      <input id="p0" inputmode="numeric" maxlength="1" aria-label="코드 첫째 자리" autocomplete="off">
      <input id="p1" inputmode="numeric" maxlength="1" aria-label="코드 둘째 자리" autocomplete="off">
      <input id="p2" inputmode="numeric" maxlength="1" aria-label="코드 셋째 자리" autocomplete="off">
      <input id="p3" inputmode="numeric" maxlength="1" aria-label="코드 넷째 자리" autocomplete="off">
    </div>
    <p class="err" id="pinErr"></p>
  </section>

  <!-- 준비 -->
  <section class="card" id="v-setup" hidden>
    <h1>진단 준비</h1>
    <p class="muted">학년을 고르고, 답안을 누가 체크할지 정해 주세요. 결과는 저장되지 않아요.</p>
    <div class="field">학년<div class="grid-g" id="grades"></div></div>
    <label class="field" for="sname">학생 이름 (선택)<input id="sname" placeholder="예: 김한우" autocomplete="off"></label>
    <button class="btn wide-btn" type="button" id="mScreen" disabled>학생이 화면에서 문제 풀기</button>
    <p class="mode-note" id="screenNote"></p>
    <div class="modes">
      <button class="btn line" type="button" id="mStudent" disabled>종이로 풀고 학생이 답 체크</button>
      <button class="btn line" type="button" id="mTeacher" disabled>선생님이 답 입력하기</button>
    </div>
    <p class="mode-note">학생이 푸는 방식은 다 푼 뒤 코드를 다시 넣어야 결과를 볼 수 있어요.</p>
  </section>

  <!-- 화면 풀이 -->
  <section class="card" id="v-solve" hidden>
    <div class="sheet-head"><h2 id="sNo"></h2><div class="count" id="sCount"></div></div>
    <div class="bar"><i id="sBar"></i></div>
    <div class="passage" id="sPass" hidden><div class="ptag">지문</div><img id="sPassImg" alt="지문"></div>
    <img class="qimg" id="sImg" alt="문제">
    <p class="multi" id="sMulti" hidden>정답을 모두 골라 주세요.</p>
    <div class="bigopts" id="sOpts"></div>
    <div class="sheet-foot">
      <button class="btn line" type="button" id="sPrev">← 이전 문제</button>
      <button class="btn" type="button" id="sNext">다음 문제 →</button>
    </div>
  </section>

  <!-- 답안 -->
  <section class="card" id="v-sheet" hidden>
    <div class="sheet-head">
      <div><h2 id="sheetTitle"></h2><p class="muted" id="sheetSub" style="margin:4px 0 0"></p></div>
      <div class="count" id="count"></div>
    </div>
    <div class="bar"><i id="countBar"></i></div>
    <div class="rows" id="rows"></div>
    <div class="sheet-foot">
      <button class="btn line" type="button" id="sheetBack">← 처음으로</button>
      <button class="btn" type="button" id="submit" disabled>다 풀었어요</button>
    </div>
  </section>

  <!-- 학생 → 선생님 넘기기 -->
  <section class="card handoff" id="v-hand" hidden>
    <div class="big" aria-hidden="true">👏</div>
    <h2 class="t1" style="margin-top:12px">수고했어요!</h2>
    <p class="muted">이제 선생님께 화면을 보여 주세요.</p>
    <button class="btn" type="button" id="toTeacher" style="margin-top:14px">선생님 확인하기</button>
  </section>

  <!-- 결과 -->
  <section id="v-result" hidden>
    <div class="card cap" id="capture"></div>
    <div class="res-actions">
      <button class="btn" type="button" id="saveImg">결과 이미지로 저장</button>
      <button class="btn line" type="button" id="again">새 진단 시작</button>
    </div>
    <p class="muted" style="font-size:13px;margin-top:10px">결과는 어디에도 저장되지 않아요. 필요하면 이미지로 저장해 학부모님께 보내 주세요.</p>
  </section>
</main>

function ipath(f){return `diag/${IMG[st.grade].dir}/${f}?v=1106b`}
function renderSolve(){
  const K=key(),i=st.cur,q=K[i],m=IMG[st.grade].map[String(i+1)]||{},opt=st.grade==="예비초"?4:5,cur=st.ans[i]||[];
  $("sNo").textContent=`${i+1}번 문제`;$("sCount").textContent=`${i+1} / ${K.length}`;$("sBar").style.width=((i+1)/K.length*100)+"%";
  $("sPass").hidden=!m.p;if(m.p)$("sPassImg").src=ipath(m.p);
  $("sImg").src=m.q?ipath(m.q):"";
  $("sMulti").hidden=q.a.length<2;
  $("sOpts").className="bigopts"+(opt===4?" four":"");
  $("sOpts").innerHTML=MARK.slice(0,opt).map((mk,j)=>`<button type="button" data-o="${j}" class="${cur.includes(j)?"on":""}" aria-label="${mk}">${mk}</button>`).join("");
  $("sOpts").querySelectorAll("button").forEach(b=>b.onclick=()=>{const o=+b.dataset.o;let c=st.ans[i]||[];
    if(q.a.length>1)c=c.includes(o)?c.filter(x=>x!==o):[...c,o];else c=[o];st.ans[i]=c;
    $("sOpts").querySelectorAll("button").forEach(x=>x.classList.toggle("on",c.includes(+x.dataset.o)));
    if(q.a.length<2&&i<K.length-1)setTimeout(()=>{if(st.cur===i){st.cur++;renderSolve();window.scrollTo({top:0})}},350)});
  $("sPrev").disabled=i===0;
  const left=K.length-Object.values(st.ans).filter(a=>a.length).length;
  $("sNext").textContent=i<K.length-1?"다음 문제 →":(left?`다 풀었어요 (${left}개 안 풂)`:"다 풀었어요");
  if(i<K.length-1){const n=IMG[st.grade].map[String(i+2)]||{};[n.p,n.q].forEach(f=>{if(f){const im=new Image();im.src=ipath(f)}})}
}
$("sPrev").onclick=()=>{if(st.cur>0){st.cur--;renderSolve();window.scrollTo({top:0})}};
$("sNext").onclick=()=>{const K=key();if(st.cur<K.length-1){st.cur++;renderSolve();window.scrollTo({top:0})}else view("v-hand")};
$("mScreen").onclick=()=>start("screen");
$("mStudent").onclick=()=>start("student");$("mTeacher").onclick=()=>start("teacher");

/* 답안 */
function key(){return DATA.keys[st.grade]}
function renderSheet(){
  const K=key(),n=K.length,opt=st.grade==="예비초"?4:5;
  $("sheetTitle").textContent=(st.mode==="student"?"답안 체크":"학생 답 입력")+` · ${GL[st.grade]||st.grade}`;
  $("sheetSub").textContent=st.mode==="student"?"문제지에서 고른 번호를 눌러 주세요.":"학생이 고른 번호를 눌러 주세요.";
  $("rows").innerHTML=K.map((q,i)=>`<div class="row" id="r${i}"><div class="n">${i+1}${q.a.length>1?"<small>모두<br>고르기</small>":""}</div><div class="opts">${MARK.slice(0,opt).map((m,j)=>`<button type="button" data-q="${i}" data-o="${j}" aria-label="${i+1}번 ${m}">${m}</button>`).join("")}</div></div>`).join("");
  $("rows").querySelectorAll("button").forEach(b=>b.onclick=()=>{const q=+b.dataset.q,o=+b.dataset.o,multi=K[q].a.length>1;
    let cur=st.ans[q]||[];
    if(multi)cur=cur.includes(o)?cur.filter(x=>x!==o):[...cur,o];else cur=cur[0]===o?[]:[o];
    st.ans[q]=cur;paintRow(q);count();
    if(!multi&&cur.length&&q<n-1){const nx=$("r"+(q+1));if(nx&&nx.getBoundingClientRect().bottom>innerHeight-60)nx.scrollIntoView({block:"center",behavior:"smooth"})}});
  count();
}
function paintRow(q){const cur=st.ans[q]||[];$("r"+q).classList.toggle("done",cur.length>0);$("r"+q).querySelectorAll("button").forEach(b=>b.classList.toggle("on",cur.includes(+b.dataset.o)))}
function count(){const n=key().length,d=Object.values(st.ans).filter(a=>a.length).length;$("count").textContent=`${d} / ${n}`;$("countBar").style.width=(d/n*100)+"%";$("submit").disabled=d===0;$("submit").textContent=d<n?`다 풀었어요 (${n-d}개 빈칸)`:"다 풀었어요"}
$("sheetBack").onclick=()=>{if(st.mode==="student")askCode("처음으로 돌아가려면 코드를 입력해 주세요.",()=>view("v-setup"));else view("v-setup")};
$("submit").onclick=()=>{if(st.mode==="student")view("v-hand");else showResult()};
$("toTeacher").onclick=()=>askCode("결과를 보려면 지부 코드를 입력해 주세요.",showResult);

/* 채점 */
const AREA_ORDER=["사실적","추론적","비판적","어휘력"];
function band(p){return p>=76?"상":p>=51?"중":"하"}
function grade3(lv){return lv===0?"g":lv===1?"m":"l"}
function score(){
  const K=key();let ok=0;const ar={},wrong=[];
  K.forEach((q,i)=>{const a=(st.ans[i]||[]).slice().sort(),r=q.a.slice().sort();const good=a.length===r.length&&a.every((x,j)=>x===r[j]);
    ar[q.area]=ar[q.area]||{ok:0,n:0};ar[q.area].n++;if(good){ok++;ar[q.area].ok++}else wrong.push({no:i+1,area:q.area,diff:q.d})});
  const lv=ok>=18?0:ok>=15?1:ok>=12?2:3;
  return {ok,n:K.length,lv,ar,wrong};
}
/* 추천 */
const REG={"예비초":[["꿈꾸는 새싹","saessak"]],"초1":[["어휘리더1","vocab"]],"초2":[["어휘리더2","vocab"]],"초3":[["독서리더1","reading"],["과학탐탐","science"]],"초4":[["독서리더2","reading"],["한국사 뛰어넘기","korjump"]],"초5":[["논리리더1","logic"],["세계문화·지리","geo"]],"초6":[["논리리더2","logic"],["세계사 뛰어넘기","worldjump"]],"중1":[["중등 교과독서","socrates"]]};
const MOLIP_UP={"예비초":"P","초1":"A","초2":"A","초3":"B","초4":"C","초5":"D","초6":"S","중1":"S"};
const MOLIP_LOW={"예비초":"P","초1":"P","초2":"A","초3":"B","초4":"B","초5":"C","초6":"D","중1":"S"};
const SP={"초2":[["다다어휘","dada","어휘·문해력 기초"]],"초3":[["다다어휘","dada","어휘·문해력 기초"]],"초4":[["다다어휘","dada","어휘·문해력 기초"]],
  "초5":[["똑독해","ttokdok","비문학 독해"],["한국사봄","korbom","한국사 심화"]],"초6":[["똑독해","ttokdok","비문학 독해"],["한국사봄","korbom","한국사 심화"]],"중1":[["별별 문학 독해","galrae","문학 독해"]]};
function link(name,id,sub){return `<a href="courses.html#${id}"><span><b>${esc(name)}</b>${sub?`<br><small>${esc(sub)}</small>`:""}</span><span aria-hidden="true">›</span></a>`}
function recHTML(r){
  const g=st.grade,sp=SP[g]||[],weak=AREA_ORDER.filter(a=>r.ar[a]).sort((a,b)=>r.ar[a].ok/r.ar[a].n-r.ar[b].ok/r.ar[b].n)[0];
  if(r.lv<=1){
    const opts=[];
    const spPick=sp.slice().sort((a,b)=>{const pa=(weak==="사실적"||weak==="비판적")&&a[1]==="ttokdok"||((weak==="추론적"||weak==="어휘력")&&a[1]==="dada");const pb=(weak==="사실적"||weak==="비판적")&&b[1]==="ttokdok"||((weak==="추론적"||weak==="어휘력")&&b[1]==="dada");return pb-pa});
    spPick.forEach(s=>opts.push(link(s[0],s[1],(s[1]==="korbom"?"심화 특강":"특강")+" · "+s[2])));
    opts.push(link(`몰입독서 ${MOLIP_UP[g]}단계`,"molip","한 권을 끝까지 깊이 읽는 힘"));
    return `<div class="rec"><div class="label">추천 과정</div><h4>학년 정규과정 + 함께 하면 좋은 과정</h4>
      <p>${esc(GL[g]||g)} 정규과정을 바탕으로, ${weak?`가장 보완하면 좋은 영역(${weak}${weak==="어휘력"?"":" 이해력"})에 맞춰`:""} 아래 과정 가운데 하나를 더해 보세요.</p>
      <div class="combo">${REG[g].map(x=>link(x[0],x[1],"학년 정규과정")).join("")}</div>
      <p style="margin-top:14px;font-weight:700;color:var(--ink)">함께 하면 좋은 과정</p><div class="combo">${opts.join("")}</div></div>`;
  }
  const m=MOLIP_LOW[g],combos=[link(`몰입독서 ${m}단계 · 주 2회`,"molip","몰입독서 + 몰입독서")];
  sp.filter(s=>s[1]!=="korbom").forEach(s=>combos.push(link(`몰입독서 ${m}단계 + ${s[0]}`,s[1],"몰입독서 + 특강 · "+s[2])));
  return `<div class="rec"><div class="label">추천 과정 · 한우리 플러스완성반</div><h4>몰입독서로 읽기 기초부터 탄탄하게</h4>
    <p>지금은 학년 정규과정보다 몰입독서로 한 권을 끝까지 읽는 힘을 먼저 키우는 것이 좋아요.</p>
    <div class="combo">${combos.join("")}</div>
    <div class="plus"><b>한우리 플러스완성반</b>은 한우리 선생님이 상담으로 아이의 학습 상태와 고민을 파악하고, 아이에게 필요한 두 가지 프로그램을 조합해 만드는 맞춤 커리큘럼이에요.</div></div>`;
}
function showResult(){
  const r=score(),g=st.grade,T=DATA.texts,lvName=["잘함","보통","부족","노력 요함"][r.lv],lt=T.levels[g][r.lv];
  const today=new Date(),ds=`${today.getFullYear()}.${today.getMonth()+1}.${today.getDate()}`;
  const areas=AREA_ORDER.filter(a=>r.ar[a]).map(a=>{const x=r.ar[a],p=Math.round(x.ok/x.n*100),b=band(p),c=b==="상"?"var(--good)":b==="중"?"var(--mid)":"var(--low)";
    const d=(T.areas[g]&&T.areas[g][a]&&T.areas[g][a][b])||(T.areas["초1"][a]&&T.areas["초1"][a][b])||(a==="어휘력"?"읽고 쓰고 말하는 과정에서 낱말을 정확하게 이해하여 활용하는 능력이에요.":"");
    return `<div class="area"><div class="area-top"><span>${a}${a==="어휘력"?"":" 이해력"}<span class="tag" style="background:${b==="상"?"var(--good-soft)":b==="중"?"var(--mid-soft)":"var(--low-soft)"};color:${c}">${b}</span></span><span>${x.ok} / ${x.n}</span></div>
      <div class="area-bar"><i style="width:${p}%;background:${c}"></i></div><p>${esc(d)}</p></div>`}).join("");
  $("capture").innerHTML=`
    <div class="res-head"><div><div class="muted" style="font-size:14px">${esc(ds)} · ${esc(GL[g]||g)} ${g==="예비초"?"국어 능력 진단":"입회테스트"}</div>
      <h2 class="t1" style="margin-top:4px">${st.name?esc(st.name)+" 학생 ":""}진단 결과</h2></div>
      <div style="text-align:right"><div class="score">${r.ok}<small> / ${r.n}</small></div><span class="lv ${grade3(r.lv)}" style="margin-top:6px">${lvName}</span></div></div>
    <div class="lvtext">${lt.map(s=>`<p>${esc(s)}</p>`).join("")}</div>
    <div class="sec"><h3>영역별 결과</h3><div class="areas">${areas}</div></div>
    ${r.wrong.length?`<div class="sec"><h3>다시 보면 좋은 문항</h3><div class="wrong">${r.wrong.map(w=>`<span>${w.no}번 · ${w.area} · ${w.diff}</span>`).join("")}</div></div>`:""}
    <div class="sec">${recHTML(r)}</div>
    <p class="muted" style="font-size:12px;margin:18px 0 0">한우리독서토론논술</p>`;
  view("v-result");
}
$("again").onclick=()=>{st.ans={};$("sname").value="";view("v-setup")};
$("saveImg").onclick=async()=>{
  if(!window.html2canvas){$("saveImg").textContent="저장 도구를 못 불러왔어요. 화면을 캡처해 주세요";return}
  const b=$("saveImg");b.disabled=true;b.textContent="만드는 중이에요…";
  try{const c=await html2canvas($("capture"),{scale:2,backgroundColor:getComputedStyle(document.body).backgroundColor});
    c.toBlob(blob=>{const f=`진단결과_${st.name||st.grade}.png`;
      if(navigator.canShare&&navigator.canShare({files:[new File([blob],f,{type:"image/png"})]}))navigator.share({files:[new File([blob],f,{type:"image/png"})]}).catch(()=>{});
      else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=f;document.body.appendChild(a);a.click();a.remove()}
      b.disabled=false;b.textContent="결과 이미지로 저장"},"image/png");
  }catch(e){b.disabled=false;b.textContent="저장이 안 됐어요. 화면을 캡처해 주세요"}
};

st.unlocked=true;view("v-setup");
