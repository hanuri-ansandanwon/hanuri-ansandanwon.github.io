<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한우리 교사 상담도우미 | 과정 안내</title>
<meta name="description" content="한우리독서토론논술 — 과정별 차시와 수업 내용을 자세히 안내해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 왼쪽 과정 목록 + 오른쪽 과정 상세(소개 → 단계·월/호 탭 → 차시 아코디언). 휴대폰은 목록이 위 가로 줄로 */
:root{
  --bg:#ffffff;--paper:#fff6ef;--ink:#2a1d14;--muted:#6f5d50;--line:#efdccd;
  --orange:#f26a1b;--orange-deep:#c94f0a;--orange-soft:#ffe7d6;--leaf:#3f7d5a;--leaf-soft:#e3f1e8;--chip:#fff;
  --logo-bg:transparent;--logo-pad:0;
  --display:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1410;--paper:#241a14;--ink:#f6ebe2;--muted:#c2ad9d;--line:#3d2e24;--orange:#ff8a45;--orange-deep:#ffa36b;--orange-soft:#3a2416;--leaf:#7cc29a;--leaf-soft:#1f3328;--chip:#2b2019;--logo-bg:#fff;--logo-pad:5px 10px;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1410;--paper:#241a14;--ink:#f6ebe2;--muted:#c2ad9d;--line:#3d2e24;--orange:#ff8a45;--orange-deep:#ffa36b;--orange-soft:#3a2416;--leaf:#7cc29a;--leaf-soft:#1f3328;--chip:#2b2019;--logo-bg:#fff;--logo-pad:5px 10px;color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%}[hidden]{display:none!important}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:12px;min-height:64px;padding-block:8px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo-chip{display:inline-flex;background:var(--logo-bg);border-radius:10px;padding:var(--logo-pad)}
.logo{height:40px;width:auto;display:block}
.branch{font-weight:700;font-size:15px;padding-left:12px;border-left:2px solid var(--orange);line-height:1.2;white-space:nowrap}
.home{margin-left:auto;text-decoration:none;font-weight:700;font-size:14px;color:var(--orange-deep);border:1.5px solid var(--orange);border-radius:10px;padding:7px 14px;white-space:nowrap}
@media (max-width:640px){.logo{height:30px}.branch{font-size:13px;padding-left:8px}.home{padding:6px 10px;font-size:13px}}

.top{background:var(--paper);padding-block:28px 22px;border-bottom:1px solid var(--line)}
.top h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,36px);margin:0;line-height:1.3;text-wrap:balance}
.top p{margin:6px 0 0;color:var(--muted)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.grades{display:flex;gap:6px;flex-wrap:wrap}
.grades button{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer}
.grades button.on{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);max-width:360px}
.search:focus-within{border-color:var(--orange)}
.search input{border:0;outline:0;background:transparent;font:inherit;color:var(--ink);padding:9px 0;width:100%;min-width:0}

.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;padding-block:24px 64px}
.list{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.grp{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin:16px 0 6px}
.grp:first-child{margin-top:0}
.ci{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:9px 12px;cursor:pointer}
.ci b{font-weight:500}
.ci small{color:var(--muted);font-size:12px;white-space:nowrap}
.ci:hover{background:var(--orange-soft)}
.ci.on{background:var(--orange);color:#fff}
.ci.on small{color:#fff;opacity:.9}
.ci.on b{font-weight:700}
.empty{color:var(--muted);font-size:14px;padding:10px 12px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;gap:16px;padding-top:14px}
  .list{position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .grp{display:none}
  .ci{flex:none;width:auto;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
  .ci small{display:none}
}

.detail{min-width:0}
.d-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--orange-soft);color:var(--orange-deep)}
.tag.g{background:var(--leaf-soft);color:var(--leaf)}
.d-title{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.5vw,42px);margin:8px 0 0;line-height:1.25}
.d-tag{font-size:18px;color:var(--orange-deep);font-weight:700;margin:8px 0 0}
.d-about{color:var(--muted);max-width:65ch;margin:10px 0 0}
.points{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:20px}
.pt{border-top:3px solid var(--orange);padding:12px 2px 2px}
.pt h3{margin:0;font-size:15px}
.pt p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.info{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:20px 0 0;padding:14px 16px;background:var(--paper);border-radius:12px;font-size:14px}
.info dt{font-weight:700;color:var(--orange-deep);white-space:nowrap}
.info dd{margin:0;min-width:0}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--orange);padding:6px 12px;background:var(--orange-soft);border-radius:0 8px 8px 0;margin-top:14px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:28px}
.tabs button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:700;color:var(--muted)}
.tabs button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.units{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.units button{border:0;background:transparent;border-bottom:3px solid transparent;padding:6px 10px;cursor:pointer;color:var(--muted);font-weight:500}
.units button.on{border-bottom-color:var(--orange);color:var(--ink);font-weight:700}
.ses-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.ses-head h2{margin:0;font-size:18px}
.toggle{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.sessions{display:grid;gap:10px;margin-top:12px}
.ses{border:1px solid var(--line);border-radius:16px;background:var(--bg);overflow:hidden}
.ses.open{border-color:var(--orange);box-shadow:0 6px 18px rgba(201,79,10,.10)}
.ses-btn{display:grid;grid-template-columns:auto 62px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:transparent;border:0;padding:14px 16px;cursor:pointer}
.no{font-family:var(--display);font-weight:800;font-size:15px;color:var(--orange-deep);width:44px;text-align:center;line-height:1.1}
.no span{display:block;font-size:22px}
.cov{width:62px;aspect-ratio:5/7;border-radius:6px;background:var(--paper);object-fit:cover;display:block;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.cov.blank{display:grid;place-items:center;color:var(--muted);font-size:11px}
.ses-main{min-width:0}
.ses-main .type{font-size:12px;font-weight:700;color:var(--leaf)}
.ses-main h3{margin:2px 0 0;font-size:17px;line-height:1.4}
.ses-main p{margin:3px 0 0;font-size:14px;color:var(--muted)}
.chev{font-size:18px;color:var(--muted);transition:transform .2s}
.ses.open .chev{transform:rotate(180deg);color:var(--orange)}
.ses-body{padding:0 16px 16px calc(16px + 44px + 14px)}
.ses-body h4{margin:0 0 4px;font-size:13px;color:var(--orange-deep)}
.ses-body .act{margin:0;font-size:15px;line-height:1.75;max-width:65ch}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin-top:12px;font-size:13px}
.meta dt{color:var(--muted);white-space:nowrap}
.meta dd{margin:0;min-width:0}
.comp{display:flex;gap:4px;flex-wrap:wrap}
.comp span{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf);font-weight:700}
@media (max-width:640px){
  .ses-btn{grid-template-columns:auto 50px minmax(0,1fr);gap:10px;padding:12px}
  .cov{width:50px}
  .chev{display:none}
  .no{width:36px}
  .ses-body{padding:0 12px 14px 12px}
}
.cta{margin-top:30px;padding:20px;border-radius:16px;background:var(--ink);color:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.cta b{font-family:var(--display);font-size:20px}
.cta a{background:var(--orange);color:#fff;text-decoration:none;font-weight:700;padding:11px 20px;border-radius:12px}
footer{border-top:1px solid var(--line);padding-block:22px;color:var(--muted);font-size:13px}

</style>
</head>

<section class="top">
  <div class="wrap">
    <h1>과정·차시 한눈에 보기</h1>
    <p>과정을 고르고, 차시를 누르면 그 시간에 어떤 수업을 하는지 자세히 보여요.</p>
    <div class="tools">
      <div class="grades" id="grades" role="group" aria-label="학년으로 보기"></div>
      <label class="search" for="q"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="과정·책 제목 찾기 (예: 어린 왕자)" aria-label="과정이나 책 제목 검색"></label>
    </div>
  </div>
</section>

<main class="wrap layout">
  <nav class="list" id="list" aria-label="과정 목록"></nav>
  <article class="detail" id="detail"></article>
</main>

<footer><div class="wrap">차시 내용은 본사 수업계획안·활동리포트를 바탕으로 해요.</div></footer>

<script src="course-data.js"></script>
<script>
const D=JSON.parse(decodeURIComponent(escape(atob(window.CD.split("").reverse().join(""))))), TH=D.thumbs;
const GRADES=["전체","유치","초1","초2","초3","초4","초5","초6","중1","중2","중3"];
const GROUPS=["정규과정","몰입독서","초등특강","중등특강"];
const st={grade:"전체",q:"",cid:null,level:0,unit:0,openAll:false,open:new Set()};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").replace(/\s/g,"").toLowerCase();

function bookHit(c,q){return c.levels.some(l=>l.units.some(u=>u.sessions.some(s=>norm(s.book+s.type).includes(q))))}
function visible(){
  const q=norm(st.q);
  return D.courses.filter(c=>(st.grade==="전체"||c.grades.includes(st.grade))&&(!q||norm(c.name).includes(q)||bookHit(c,q)));
}
function renderGrades(){
  const g=document.getElementById("grades");
  g.innerHTML=GRADES.map(x=>`<button type="button" class="${x===st.grade?"on":""}" data-g="${x}">${x}</button>`).join("");
  g.querySelectorAll("button").forEach(b=>b.onclick=()=>{st.grade=b.dataset.g;renderGrades();renderList(true)});
}
function renderList(autopick){
  const v=visible(), el=document.getElementById("list");
  if(!v.length){el.innerHTML=`<div class="empty">맞는 과정이 없어요. 학년이나 검색어를 바꿔 보세요.</div>`;return}
  el.innerHTML=GROUPS.map(g=>{const cs=v.filter(c=>c.group===g);if(!cs.length)return"";
    return `<div class="grp">${g}</div>`+cs.map(c=>`<button type="button" class="ci${c.id===st.cid?" on":""}" data-id="${c.id}"><b>${esc(c.name)}</b><small>${esc(c.gradeText)}</small></button>`).join("")}).join("");
  el.querySelectorAll(".ci").forEach(b=>b.onclick=()=>pick(b.dataset.id,true));
  if(autopick&&!v.some(c=>c.id===st.cid))pick(v[0].id,false);
  else if(autopick)pick(st.cid,false);
}
function pick(id,scroll){
  const c=D.courses.find(x=>x.id===id);if(!c)return;
  if(st.cid!==id){st.level=0;st.unit=0;st.open.clear()}
  st.cid=id;
  // 학년에 맞는 단계 자동 선택
  if(st.grade!=="전체"){
    const i=c.levels.findIndex(l=>(c.levelGrades&&c.levelGrades[l.label]||[]).includes(st.grade));
    if(i>=0&&c.levelGrades)st.level=i;
    else if(c.levels.length===c.grades.length){const j=c.grades.indexOf(st.grade);if(j>=0)st.level=j}
  }
  // 검색어가 책이면 그 호/달로
  const q=norm(st.q);
  if(q&&!norm(c.name).includes(q)){
    outer:for(let li=0;li<c.levels.length;li++)for(let ui=0;ui<c.levels[li].units.length;ui++){
      const ss=c.levels[li].units[ui].sessions;const k=ss.findIndex(s=>norm(s.book+s.type).includes(q));
      if(k>=0){st.level=li;st.unit=ui;st.open=new Set([k]);break outer}}
  }
  document.querySelectorAll(".ci").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
  renderDetail();
  if(location.hash.slice(1)!==id)history.replaceState(null,"","#"+id);
  if(scroll&&window.matchMedia("(max-width:860px)").matches)document.getElementById("detail").scrollIntoView({behavior:"smooth",block:"start"});
}
function renderDetail(){
  const c=D.courses.find(x=>x.id===st.cid), el=document.getElementById("detail");
  const L=c.levels[st.level]||c.levels[0], U=L.units[st.unit]||L.units[0];
  const unitWord=U.label.endsWith("월")?"2026년 "+U.label+" 계획":U.label;
  el.innerHTML=`
   <div class="d-head"><span class="tag">${esc(c.group)}</span><span class="tag g">${esc(c.gradeText)}</span></div>
   <h2 class="d-title">${esc(c.name)}</h2>
   <p class="d-tag">${esc(c.tagline)}</p>
   <p class="d-about">${esc(c.about)}</p>
   ${c.points.length?`<div class="points">${c.points.map(p=>`<div class="pt"><h3>${esc(p[0])}</h3><p>${esc(p[1])}</p></div>`).join("")}</div>`:""}
   <dl class="info">${c.info.map(i=>`<dt>${esc(i[0])}</dt><dd>${esc(i[1])}</dd>`).join("")}</dl>
   ${c.note?`<p class="note">${esc(c.note)}</p>`:""}
   ${c.levels.length>1?`<div class="tabs" role="tablist" aria-label="단계">${c.levels.map((l,i)=>`<button type="button" role="tab" aria-selected="${i===st.level}" class="${i===st.level?"on":""}" data-l="${i}">${esc(l.label)}</button>`).join("")}</div>`:`<div class="tabs"></div>`}
   <div class="units" role="tablist" aria-label="${U.label.endsWith("월")?"월":"호"}">${L.units.map((u,i)=>`<button type="button" role="tab" aria-selected="${i===st.unit}" class="${i===st.unit?"on":""}" data-u="${i}">${esc(u.label)}</button>`).join("")}</div>
   <div class="ses-head"><h2>${esc(L.label)} · ${esc(unitWord)}</h2><button type="button" class="toggle" id="toggle">${st.openAll?"모두 접기":"모두 펼치기"}</button></div>
   <div class="sessions">${U.sessions.map((s,i)=>{const o=st.openAll||st.open.has(i);const t=s.cover&&TH[s.cover];
     return `<div class="ses${o?" open":""}">
      <button type="button" class="ses-btn" aria-expanded="${o}" data-i="${i}">
       <span class="no"><span>${esc(s.no)}</span>차시</span>
       ${t||s.coverUrl?`<img class="cov" src="${t||s.coverUrl}" alt="${esc(s.book)} 표지" loading="lazy" onerror="this.outerHTML='<span class=&quot;cov blank&quot;>표지</span>'">`:`<span class="cov blank">표지</span>`}
       <span class="ses-main"><span class="type">${esc(s.type)}</span><h3>${esc(s.book)}</h3>${s.short?`<p>${esc(s.short)}</p>`:""}</span>
       <span class="chev" aria-hidden="true">⌄</span>
      </button>
      <div class="ses-body"${o?"":" hidden"}>
       <h4>이렇게 수업해요</h4><p class="act">${esc(s.act)}</p>
       <dl class="meta">${s.cur?`<dt>교과 연계</dt><dd>${esc(s.cur)}</dd>`:""}${s.comp&&s.comp.length?`<dt>키우는 역량</dt><dd class="comp">${s.comp.map(x=>`<span>${esc(x)}</span>`).join("")}</dd>`:""}</dl>
      </div></div>`}).join("")}</div>
   `;
  el.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{st.level=+b.dataset.l;st.unit=0;st.open.clear();renderDetail()});
  el.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{st.unit=+b.dataset.u;st.open.clear();renderDetail()});
  el.querySelectorAll(".ses-btn").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(st.openAll){st.openAll=false;st.open=new Set(U.sessions.map((_,k)=>k))}
    st.open.has(i)?st.open.delete(i):st.open.add(i);
    const box=b.parentElement,o=st.open.has(i);box.classList.toggle("open",o);b.setAttribute("aria-expanded",o);box.querySelector(".ses-body").hidden=!o});
  document.getElementById("toggle").onclick=()=>{st.openAll=!st.openAll;st.open.clear();renderDetail()};
}
document.getElementById("q").addEventListener("input",e=>{st.q=e.target.value;renderList(true)});
function fromHash(){const h=location.hash.slice(1);if(h&&D.courses.some(c=>c.id===h)){pick(h,false);renderList(false)}}
renderGrades();
st.cid=(D.courses.find(c=>c.id===location.hash.slice(1))||D.courses[0]).id;
renderList(false);pick(st.cid,false);
window.addEventListener("hashchange",fromHash);
</script>
</body>
</html>
